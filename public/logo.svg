<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffaf4"/><stop offset="1" stop-color="#f6e6d6"/></linearGradient>
    <linearGradient id="wand" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3e6"/><stop offset="1" stop-color="#f3dcc6"/></linearGradient>
    <linearGradient id="dach" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ee7234"/><stop offset="1" stop-color="#c9521b"/></linearGradient>
    <radialGradient id="fell" cx="0.45" cy="0.35" r="0.75"><stop offset="0" stop-color="#b98a5f"/><stop offset="0.65" stop-color="#9c6c45"/><stop offset="1" stop-color="#7a5134"/></radialGradient>
    <radialGradient id="schnauze" cx="0.5" cy="0.35" r="0.7"><stop offset="0" stop-color="#9a6a46"/><stop offset="1" stop-color="#6e472d"/></radialGradient>
    <radialGradient id="ohr" cx="0.5" cy="0.5" r="0.6"><stop offset="0" stop-color="#5e3b25"/><stop offset="1" stop-color="#7a5134"/></radialGradient>
    <linearGradient id="tuer" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a2a22"/><stop offset="1" stop-color="#22181360"/></linearGradient>
    <filter id="schatten" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#5a2a10" flood-opacity="0.25"/></filter>
  </defs>
  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <!-- ground -->
  <ellipse cx="512" cy="880" rx="330" ry="34" fill="#e9cfb6"/>
  <g filter="url(#schatten)">
    <!-- chimney -->
    <rect x="660" y="218" width="64" height="130" rx="10" fill="#c9521b"/>
    <rect x="648" y="206" width="88" height="28" rx="10" fill="#a8441a"/>
    <!-- walls -->
    <path d="M232 470 L512 260 L792 470 V818 a34 34 0 0 1 -34 34 H266 a34 34 0 0 1 -34 -34 Z" fill="url(#wand)"/>
    <!-- roof -->
    <path d="M168 486 L512 214 L856 486" fill="none" stroke="url(#dach)" stroke-width="66" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M232 470 L512 252 L792 470" fill="none" stroke="#a8441a" stroke-width="8" stroke-opacity="0.35"/>
    <!-- round attic window -->
    <circle cx="512" cy="408" r="52" fill="#fdf1e2" stroke="#c9521b" stroke-width="14"/>
    <path d="M512 360 V456 M464 408 H560" stroke="#c9521b" stroke-width="9"/>
    <!-- door frame -->
    <path d="M352 852 V600 C352 516 424 470 512 470 C600 470 672 516 672 600 V852 Z" fill="#c9521b"/>
    <path d="M378 852 V604 C378 534 438 496 512 496 C586 496 646 534 646 604 V852 Z" fill="url(#tuer)"/>
  </g>
  <!-- capybara in the door -->
  <g>
    <!-- shoulders -->
    <path d="M396 852 C396 760 440 712 512 712 C584 712 628 760 628 852 Z" fill="url(#fell)"/>
    <!-- head -->
    <path d="M404 640 C404 568 452 534 512 534 C572 534 620 568 620 640 L622 716 C622 780 574 812 512 812 C450 812 402 780 402 716 Z" fill="url(#fell)"/>
    <!-- ears -->
    <ellipse cx="428" cy="566" rx="30" ry="24" transform="rotate(-18 428 566)" fill="#7a5134"/>
    <ellipse cx="430" cy="568" rx="17" ry="12" transform="rotate(-18 430 568)" fill="url(#ohr)"/>
    <ellipse cx="596" cy="566" rx="30" ry="24" transform="rotate(18 596 566)" fill="#7a5134"/>
    <ellipse cx="594" cy="568" rx="17" ry="12" transform="rotate(18 594 568)" fill="url(#ohr)"/>
    <!-- fur strokes -->
    <g stroke="#7a5134" stroke-width="5" stroke-linecap="round" opacity="0.45" fill="none">
      <path d="M470 560 q8 -10 18 -12"/><path d="M500 552 q8 -8 18 -6"/><path d="M532 556 q10 -4 18 2"/>
      <path d="M416 650 q-8 10 -6 22"/><path d="M608 650 q8 10 6 22"/>
      <path d="M430 760 q-6 12 -2 22"/><path d="M594 760 q6 12 2 22"/>
    </g>
    <!-- muzzle -->
    <path d="M444 706 C444 664 474 646 512 646 C550 646 580 664 580 706 C580 752 552 778 512 778 C472 778 444 752 444 706 Z" fill="url(#schnauze)"/>
    <ellipse cx="512" cy="664" rx="44" ry="10" fill="#b98a5f" opacity="0.35"/>
    <!-- nostrils -->
    <path d="M482 688 q8 -8 16 0 q-8 6 -16 0 z" fill="#2e1d12"/>
    <path d="M526 688 q8 -8 16 0 q-8 6 -16 0 z" fill="#2e1d12"/>
    <!-- mouth -->
    <path d="M512 708 V726 M490 734 q22 18 44 0" fill="none" stroke="#2e1d12" stroke-width="7" stroke-linecap="round"/>
    <!-- eyes -->
    <ellipse cx="460" cy="626" rx="15" ry="17" fill="#22150c"/>
    <circle cx="465" cy="619" r="5.5" fill="#fff"/><circle cx="456" cy="632" r="2.2" fill="#fff" opacity="0.8"/>
    <ellipse cx="564" cy="626" rx="15" ry="17" fill="#22150c"/>
    <circle cx="569" cy="619" r="5.5" fill="#fff"/><circle cx="560" cy="632" r="2.2" fill="#fff" opacity="0.8"/>
    <!-- cheeks -->
    <ellipse cx="434" cy="680" rx="22" ry="13" fill="#f39a78" opacity="0.55"/>
    <ellipse cx="590" cy="680" rx="22" ry="13" fill="#f39a78" opacity="0.55"/>
    <!-- whiskers -->
    <g stroke="#3b2516" stroke-width="3" stroke-linecap="round" opacity="0.5">
      <path d="M452 704 L410 698"/><path d="M452 714 L412 718"/>
      <path d="M572 704 L614 698"/><path d="M572 714 L612 718"/>
    </g>
    <!-- paws on the threshold -->
    <ellipse cx="462" cy="846" rx="34" ry="18" fill="#7a5134"/>
    <ellipse cx="562" cy="846" rx="34" ry="18" fill="#7a5134"/>
    <g stroke="#5e3b25" stroke-width="4" stroke-linecap="round"><path d="M450 840 v10"/><path d="M462 838 v12"/><path d="M474 840 v10"/><path d="M550 840 v10"/><path d="M562 838 v12"/><path d="M574 840 v10"/></g>
  </g>
</svg>
