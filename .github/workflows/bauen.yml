# Tests, server image and Mac app.
#   Every push to master and every pull request: security audit of the libraries, type check and all tests.
#   Push to master (tests green): image ghcr.io/grancolombianodealemania/mietshaus:latest – for trying out – after a
#   smoke test of the locked-down container and a security scan.
#   Tag vX.Y.Z (tests green): image X.Y.Z, X.Y and stable – what the Synology runs – and a GitHub release with the
#   Mac app (zip + SHA-256), from which the app updates itself.
name: Bauen
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
  packages: write
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      # Known security holes in the libraries the server runs with stop the build.
      - run: npm audit --omit=dev --audit-level=high
      - run: npx tsc --noEmit
      - run: node scripts/rechentest.cjs
      - run: node scripts/sicherungstest.cjs
      - run: node scripts/claudetest.cjs
      # The server test also checks the page, logo and service worker: they come from the built interface.
      - run: npx vite build
      - run: node scripts/servertest.cjs
      - run: node scripts/fintstest.cjs
      # A tag must carry the version of package.json, so app, server and release agree.
      - if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"

  image:
    needs: tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/mietshaus
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=stable,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      # First the image for this runner, started locked down like on the Synology, must pass the smoke test.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: mietshaus:rauchtest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: bash scripts/rauchtest.sh mietshaus:rauchtest
      # Known holes in the base system and libraries of the image: reported, not blocking.
      - run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.75.0 image --quiet --severity HIGH,CRITICAL \
            --ignore-unfixed --exit-code 0 mietshaus:rauchtest | tee trivy.txt
          { echo '### Sicherheitsscan des Images'; echo '```'; cat trivy.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  mac:
    needs: tests
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node node_modules/electron/install.js
      - run: npm run dist:mac
      - run: shasum -a 256 release/Mietshaus-mac-arm64.zip | cut -d' ' -f1 > release/Mietshaus-mac-arm64.zip.sha256
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "Mietshaus ${GITHUB_REF_NAME#v}" --generate-notes \
            release/Mietshaus-mac-arm64.zip release/Mietshaus-mac-arm64.zip.sha256
