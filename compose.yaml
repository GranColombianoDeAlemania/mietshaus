# Mietshaus on the Synology: Container Manager → Projekt → Erstellen, this file as compose.yaml (see ANLEITUNG-NAS.md).
services:
  mietshaus:
    # stable = the newest released version (tag vX.Y.Z); latest = every change on master, for trying out.
    image: ghcr.io/grancolombianodealemania/mietshaus:stable
    container_name: mietshaus
    restart: unless-stopped
    # The Synology user that owns the folders below (find it with `id` over SSH; the first admin is usually 1026:100).
    user: "1026:100"
    environment:
      TZ: Europe/Berlin
      # Scanner and iPhone drop documents into the shared folder "eingang"; they land in the inbox.
      MIETSHAUS_EINGANG: /eingang
    volumes:
      - /volume1/docker/mietshaus:/daten
      - /volume1/eingang:/eingang
    # Only reachable on the NAS itself: Tailscale serve forwards https://<nas>.<tailnet>.ts.net to it.
    # Never open this port on the router.
    ports:
      - "127.0.0.1:8080:8080"
